name: Deploy to Cloudflare

# Same shape as Site Scout's: tests, migrations, deploy. Runs on pushes to main
# only — the rebuild branch never deploys.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node --test
      - name: Apply D1 migrations
        run: npx wrangler@4.142.0 d1 migrations apply trip-atlas --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy Worker
        run: npx wrangler@4.142.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
